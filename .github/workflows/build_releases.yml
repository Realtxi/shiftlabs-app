name: Multi-Platform Build & Release (Android, Windows, macOS, Web)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🧪 Run Unit & Widget Tests
        run: flutter test

      - name: 🏗️ Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: 📤 Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shiftlabs-android-apk
          path: build/app/outputs/flutter-apk/*.apk

  build-web:
    name: 🌐 Build Flutter Web
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🏗️ Build Web Release
        run: flutter build web --release

      - name: 📤 Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiftlabs-flutter-web
          path: build/web/
